---
- name: kvantum | ensure kvantum installed
  kewlfft.aur.aur:
    name: kvantum
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: kvantum | ensure .config/Kvantum directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts["user_dir"] }}/.config/Kvantum'
    state: directory
    mode: '0755'
    owner: '{{ target_user }}'
    group: '{{ target_user }}'

- name: kvantum | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/kvantum/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/Kvantum/{{ item.path }}"
    state: link
    force: true
  with_filetree: kvantum/config
  when: item.state == 'file'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: kvantum | clone catppuccin theme
  ansible.builtin.git:
    repo: "https://github.com/catppuccin/Kvantum.git"
    dest: "{{ ansible_facts['user_dir'] }}/.archdot/roles/kvantum/files/kvantum/repo/catppuccin-kvantum"
    version: "main"
    force: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: kvantum | symlink theme files
  ansible.builtin.file:
    src: "{{ role_path }}/files/kvantum/repo/catppuccin-kvantum/themes/catppuccin-mocha-sky"
    dest: "{{ ansible_facts['user_dir'] }}/.config/Kvantum/catppuccin-mocha-sky"
    state: link
    force: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'