---
- name: firefox | apply firefox color theme
  ansible.builtin.shell: |
    DISPLAY=:0 nohup firefox "{{ firefox_color }}" > /dev/null 2>&1 &
    sleep 2
  when: firefox_color is defined
  environment:
    DISPLAY: ":0"
  tags:
    - firefox

- name: firefox | install userscripts
  ansible.builtin.shell: |
    DISPLAY=:0 nohup firefox "{{ item }}" > /dev/null 2>&1 &
    sleep 2
  loop: "{{ userscripts }}"
  when: userscripts is defined and userscripts | length > 0
  environment:
    DISPLAY: ":0"
  tags:
    - firefox

- name: firefox | ensure Downloads directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Downloads"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags:
    - firefox

- name: firefox | setup stylus themes for import
  ansible.builtin.copy:
    src: firefox/config/stylus.json
    dest: "{{ ansible_facts['user_dir'] }}/Downloads/stylus-themes.json"
    mode: "0644"
  tags:
    - firefox

- name: firefox | extract stylus extension UUID
  ansible.builtin.shell: |
    if [[ -f "{{ profile_subdir }}/prefs.js" ]]; then
      STYLUS_UUID=$(grep 'extensions\.webextensions\.uuids' "{{ profile_subdir }}/prefs.js" | \
        sed 's/.*"extensions\.webextensions\.uuids", "\(.*\)");.*/\1/' | \
        sed 's/\\"/"/g')
      if [[ "$STYLUS_UUID" == *"\"{7a7a4a92-a2a0-41d1-9fd7-1e92480d612d}\":"* ]]; then
        STYLUS_LOCAL_UUID=$(echo "$STYLUS_UUID" | grep -o '"{7a7a4a92-a2a0-41d1-9fd7-1e92480d612d}":"[^"]*"' | cut -d'"' -f4)
        echo "Stylus UUID found: $STYLUS_LOCAL_UUID"
      fi
    fi
  register: stylus_uuid_result
  changed_when: false
  failed_when: false
  tags:
    - firefox

- name: firefox | display stylus UUID
  ansible.builtin.debug:
    msg: "{{ stylus_uuid_result.stdout }}"
  when: stylus_uuid_result.stdout != ""
  tags:
    - firefox
