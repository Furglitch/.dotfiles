### Services ###
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --watch cliphist store

### Desktop Environment ###
exec-once = hyprpanel
exec-once = hyprpaper
exec-once = sleep 0.5s && $scriptWallpaper --random

### NFS Mounts ###
exec-once = mount /mnt/nas/cloud
exec-once = mount /mnt/nas/media

### Startup Applications ###
exec-once = $scriptWorkspaceLaunch 5 org.telegram.desktop "title:Telegram (.*)" Telegram
exec-once = $scriptWorkspaceLaunch 5 discord "title:.* - Discord" discord