- name: wallpaper | ensure upscaler installed
  kewlfft.aur.aur:
    name: upscayl-ncnn
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: wallpaper | ensure imagemagick installed
  community.general.pacman:
    name: imagemagick
    state: present

- name: e621 | load set id
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/wallpapers.yml"
    name: e621_vaulted
  no_log: true

- name: e621 | ensure set id defined
  ansible.builtin.assert:
    that: 
      - e621_vaulted.e621_set is defined
      - e621_vaulted.e621_set | length > 0
    fail_msg: "e621_set variable is not defined in wallpapers.yml"

- name: e621 | initialize posts list
  ansible.builtin.set_fact:
    e621_posts_list: []

- name: e621 | fetch pages with rate limiting
  ansible.builtin.include_tasks: handlers/fetch_wallpaper_page.yml
  loop: [1, 2]
  loop_control:
    loop_var: page_number

- name: e621 | show total posts fetched
  ansible.builtin.debug:
    msg: "Fetched {{ e621_posts_list | length }} posts from set {{ e621_vaulted.e621_set }}"

- name: e621 | artist blacklist
  ansible.builtin.set_fact:
    e621_artist_blacklist:
      - conditional_dnp
      - unknown_artist
      - third-party_edit
      - sound_warning
      - anonymous_artist

- name: e621 | check which wallpapers already exist
  ansible.builtin.stat:
    path: >-
      {{ ansible_facts['user_dir'] }}/.local/share/wallpapers/{{ (item.rating in ['q', 'e']) | ternary('.', '') }}e6.{{ item.id }}.{{(((item.tags | default({})).artist | default([]) | reject('in', e621_artist_blacklist) | map('regex_replace','[^A-Za-z0-9_-]+','') | list) | length > 0) | ternary( ((item.tags | default({})).artist | default([]) | reject('in', e621_artist_blacklist) | map('regex_replace','[^A-Za-z0-9_-]+','') | list) | join('_'), 'unknown' ) }}.{{ (item.file | default({})).ext | default('jpg') }}
  loop: "{{ e621_posts_list }}"
  register: e621_wallpaper_stats
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: e621 | download images (async with rate limiting)
  vars:
    output_filename: >-
      {{ ansible_facts['user_dir'] }}/.local/share/wallpapers/{{ (item.item.rating in ['q', 'e']) | ternary('.', '') }}e6.{{ item.item.id }}.{{(((item.item.tags | default({})).artist | default([]) | reject('in', e621_artist_blacklist) | map('regex_replace','[^A-Za-z0-9_-]+','') | list) | length > 0) | ternary( ((item.item.tags | default({})).artist | default([]) | reject('in', e621_artist_blacklist) | map('regex_replace','[^A-Za-z0-9_-]+','') | list) | join('_'), 'unknown' ) }}.{{ (item.item.file | default({})).ext | default('jpg') }}
  ansible.builtin.get_url:
    url: "{{ item.item.file.url }}"
    dest: "{{ output_filename }}"
    mode: "0644"
  loop: "{{ e621_wallpaper_stats.results }}"
  when: 
    - not item.stat.exists
    - item.item.file is defined
    - item.item.file.url is defined
    - item.item.file.url is not none
    - item.item.file.url | default('') | length > 0
    - item.item.file.ext is defined
    - item.item.file.ext is not none
  ignore_errors: true
  async: 600
  poll: 0
  register: e621_download_jobs
  throttle: 1
  loop_control:
    pause: 2
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: wallpaper | trigger processing handler
  ansible.builtin.set_fact:
    wallpaper_download_jobs: "{{ e621_download_jobs }}"
  changed_when: true
  notify: hypr | process wallpapers