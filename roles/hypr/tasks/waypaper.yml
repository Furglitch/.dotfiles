---
- name: waypaper | ensure curl and jq are installed
  kewlfft.aur.aur:
    name:
      - curl
      - jq
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: waypaper | ensure Hyprpaper is installed
  kewlfft.aur.aur:
    name: hyprpaper
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: waypaper | ensure config directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop:
    - .config/hypr
    - .config/systemd
    - .config/systemd/user
    - .config/systemd/user/timers.target.wants
    - .local/bin
    - .local/share/wallpapers
    - .dotfiles/roles/hyprland/files/waypaper/config

- name: waypaper | symlink the e6-wallpaper-sync script
  ansible.builtin.file:
    src: "{{ role_path }}/files/waypaper/bin/e6-wallpaper-sync"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/e6-wallpaper-sync"
    state: link
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
    force: true

- name: waypaper | run e6-wallpaper-sync with the environment
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/e6-wallpaper-sync"
  environment:
    E621_SET: "{{ wallpapers.e621.set_id }}"
    E621_USER: "{{ wallpapers.e621.user }}"
    E621_API_KEY: "{{ wallpapers.e621.token }}"
    USER_AGENT: "furglitch/.dotfiles"

- name: waypaper | process downloaded wallpapers
  block:
    - name: waypaper | build and install upscayl-ncnn from source
      ansible.builtin.include_tasks: "{{ role_path }}/handlers/waypaper/wallpapers_download_upscayl.yml"

    - name: waypaper | run wallpaper processing tasks
      ansible.builtin.include_tasks: "{{ role_path }}/handlers/waypaper/wallpapers_process.yml"

- name: waypaper | ensure Waypaper is installed
  kewlfft.aur.aur:
    name: waypaper
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: waypaper | process the config.ini template
  ansible.builtin.template:
    src: waypaper.config.ini.j2
    dest: "{{ role_path }}/files/waypaper/config/config.ini"
    mode: "0644"

- name: waypaper | symlink the Waypaper config directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/waypaper/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/waypaper"
    state: link
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    force: true

- name: waypaper | symlink the Waypaper service files
  ansible.builtin.file:
    src: "{{ role_path }}/files/waypaper/systemd/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    state: link
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    force: true
  loop:
    - waypaper.service
    - waypaper.timer

- name: waypaper | enable and start the Waypaper timer
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.systemd:
    name: waypaper.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ lookup('ansible.builtin.pipe', 'id -u ' + target_user) }}"
