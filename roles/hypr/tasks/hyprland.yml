---
- name: hyprland | Install hyprland
  kewlfft.aur.aur:
    name: hyprland
    state: present
    use: paru

- name: hyprland | Ensure .config/hypr directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr"
    state: directory
    mode: "0755"

- name: hyprland | ensure .config/hypr subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item.path | dirname }}"
    state: directory
    mode: "0755"
  with_filetree: hyprland/config
  when: item.state == "file"

- name: hyprland | process monitor.lua template
  ansible.builtin.template:
    src: hyprland.monitor.lua.j2
    dest: "{{ role_path }}/files/hyprland/config/modules/monitor.lua"
    mode: "0644"

- name: hyprland | remove existing .config/hypr directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr"
    state: absent

- name: hyprland | symlink hyprland config directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/hyprland/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr"
    state: link
    force: true
