---
- name: hyprland | ensure hyprland installed
  kewlfft.aur.aur:
    name: hyprland
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | ensure .config/hypr directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | ensure .config/hypr subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item.path | dirname }}"
    state: directory
    mode: "0755"
  with_filetree: hyprland/config
  when: item.state == "file"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/hyprland/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item.path }}"
    state: link
    force: true
  with_filetree: hyprland/config
  when: item.state == "file" and item.path not in ['hyprland.conf', 'modules/variables.conf']
  notify: hypr | reload hyprland
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | template monitors.conf
  ansible.builtin.template:
    src: monitors.conf.j2
    dest: "{{ role_path }}/files/hyprland/config/modules/monitors.conf"
    mode: "0644"
  notify: hypr | reload hyprland
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | template variables.conf
  ansible.builtin.template:
    src: variables.conf.j2
    dest: "{{ role_path }}/files/hyprland/config/modules/variables.conf"
    mode: "0644"
  notify: hypr | reload hyprland
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | template hyprland.conf
  ansible.builtin.template:
    src: hyprland.conf.j2
    dest: "{{ role_path }}/files/hyprland/config/hyprland.conf"
    mode: "0644"
  notify: hypr | reload hyprland
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | ensure .local/bin subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item.path | dirname }}"
    state: directory
    mode: "0755"
  with_filetree: hyprland/bin
  when: item.state == "file"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprland | symlink bin files
  ansible.builtin.file:
    src: "{{ role_path }}/files/hyprland/bin/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item.path }}"
    state: link
    force: true
  with_filetree: hyprland/bin
  when: item.state == "file"
  notify: hypr | reload hyprland
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"
