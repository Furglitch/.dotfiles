---
- name: hyprshot | ensure grim installed
  kewlfft.aur.aur:
    name: grim
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprshot | ensure slurp installed
  kewlfft.aur.aur:
    name: slurp
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: hyprshot | ensure hyprshot installed
  kewlfft.aur.aur:
    name: hyprshot
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"
