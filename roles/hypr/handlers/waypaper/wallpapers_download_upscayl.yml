---
- name: wallpaper | ensure upscayl-ncnn build dependencies are installed
  ansible.builtin.dnf:
    name:
      - git
      - cmake
      - gcc
      - gcc-c++
      - libstdc++-static
      - glslang
      - libgomp
      - vulkan-loader-devel
    state: present

- name: wallpaper | ensure upscayl source directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/src"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: wallpaper | checkout upscayl-ncnn source
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.git:
    repo: https://github.com/upscayl/upscayl-ncnn.git
    dest: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn"
    version: master
    recursive: true
    update: true

- name: wallpaper | ensure upscayl-ncnn build directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn/build"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: wallpaper | configure upscayl-ncnn build
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - cmake
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - ../src
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn/build"

- name: wallpaper | build upscayl-ncnn
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - .
      - -j
      - "{{ (ansible_facts.processor_vcpus | default(2) | int) | string }}"
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn/build"

- name: wallpaper | ensure upscayl runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  loop:
    - "{{ ansible_facts['user_dir'] }}/.local/bin"
    - "{{ ansible_facts['user_dir'] }}/.local/share/upscayl-ncnn"

- name: wallpaper | install upscayl-bin executable
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn/build/upscayl-bin"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/upscayl-ncnn"
    mode: '0755'
    remote_src: true

- name: wallpaper | install upscayl models
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.local/src/upscayl-ncnn/models/"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/upscayl-ncnn/models/"
    mode: preserve
    remote_src: true
