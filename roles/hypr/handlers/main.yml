---
- name: hypr | reload hyprland
  ansible.builtin.command:
    cmd: hyprctl reload
  ignore_errors: true
  when: ansible_env.get('XDG_SESSION_TYPE', '') == "wayland"

- name: hypr | kill hyprpanel
  ansible.builtin.command:
    cmd: hyprpanel -q

- name: hypr | reload hyprpanel
  ansible.builtin.command:
    cmd: hyprpanel &