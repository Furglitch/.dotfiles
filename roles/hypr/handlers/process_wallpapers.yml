---
# Processing wallpapers after download. Checks dimensions and upscales (LOCALLY)

- name: wallpaper | wait for downloads to complete
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ wallpaper_download_jobs.results }}"
  when: 
    - wallpaper_download_jobs is defined
    - wallpaper_download_jobs.results is defined
    - item.ansible_job_id is defined
  register: download_status
  until: download_status.finished
  retries: 60
  delay: 10
  ignore_errors: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: wallpaper | find downloaded images
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/.local/share/wallpapers/"
    patterns: "e6.*"
  register: wallpaper_files
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: wallpaper | debug found files
  ansible.builtin.debug:
    msg: "Found {{ wallpaper_files.matched }} files: {{ wallpaper_files.files | map(attribute='path') | list }}"

- name: wallpaper | check image dimensions
  ansible.builtin.command:
    cmd: "identify -format '%w %h' {{ item.path }}"
  loop: "{{ wallpaper_files.files }}"
  register: wallpaper_dimensions
  when: wallpaper_files.matched > 0
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: wallpaper | debug dimensions
  ansible.builtin.debug:
    msg: "Image {{ item.item.path }}: {{ item.stdout }}"
  loop: "{{ wallpaper_dimensions.results | default([]) }}"
  when: 
    - wallpaper_dimensions is defined
    - wallpaper_dimensions.results is defined
    - item.stdout is defined

- name: wallpaper | upscale low resolution images
  ansible.builtin.command:
    cmd: >-
      upscayl 
      -i "{{ item.item.path }}"
      -o "{{ item.item.path }}"
      -s {{ (item.stdout.split()[1] | int < 720) | ternary('4', '2') }}
  loop: "{{ wallpaper_dimensions.results | default([]) }}"
  when: 
    - wallpaper_dimensions is defined
    - wallpaper_dimensions.results is defined
    - item.stdout is defined
    - item.stdout.split()[1] | int < 1440
  register: upscale_jobs
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
