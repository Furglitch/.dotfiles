---
# Fetch a single page of e621 posts with rate limiting

- name: e621 | query page {{ page_number }}
  ansible.builtin.uri:
    url: "https://e621.net/posts.json?tags=set:{{ e621_vaulted.e621_set }}&limit=320&page={{ page_number }}"
    method: GET
    return_content: yes
    headers:
      User-Agent: "archdot/ansible"
  register: e621_page_result
  no_log: false

- name: e621 | append posts from page {{ page_number }}
  ansible.builtin.set_fact:
    e621_posts_list: "{{ e621_posts_list + e621_page_result.json.posts }}"
  when:
    - e621_page_result.json is defined
    - e621_page_result.json.posts is defined
    - e621_page_result.json.posts | length > 0

- name: e621 | rate limiting pause (2 seconds)
  ansible.builtin.pause:
    seconds: 2
  when:
    - not ansible_check_mode
    - page_number < 2
