---
- name: prismlauncher | ensure prismlauncher installed
  kewlfft.aur.aur:
    name: prismlauncher
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: "-H"
  ignore_errors: true

- name: prismlauncher | ensure PrismLauncher directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: prismlauncher | symlink catpacks directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/prismlauncher/catpacks"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/catpacks"
    state: link
    force: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: prismlauncher | symlink iconthemes directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/prismlauncher/iconthemes"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/iconthemes"
    state: link
    force: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: prismlauncher | ensure PrismLauncher/themes directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/themes"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: prismlauncher | clone Catppuccin theme
  ansible.builtin.git:
    repo: "https://github.com/catppuccin/prismlauncher.git"
    dest: "{{ role_path }}/files/prismlauncher/files/catppuccin/repo"
    version: main
    force: true
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: prismlauncher | remove existing theme directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/themes/{{ item.path }}"
    state: absent
  with_filetree: prismlauncher/files/catppuccin/repo/themes
  when: item.state == "directory" and "/" not in item.path
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: prismlauncher | symlink Catppuccin themes
  ansible.builtin.file:
    src: "{{ role_path }}/files/prismlauncher/files/catppuccin/repo/themes/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/themes/{{ item.path }}"
    state: link
    force: true
  with_filetree: prismlauncher/files/catppuccin/repo/themes
  when: item.state == "directory" and "/" not in item.path
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"