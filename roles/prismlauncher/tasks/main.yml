---
- name: prismlauncher | Install prismlauncher
  kewlfft.aur.aur:
    name: prismlauncher
    state: present
    use: paru

- name: prismlauncher | Install blockbench
  kewlfft.aur.aur:
    name: blockbench
    state: present
    use: paru

- name: prismlauncher | Symlink catpacks
  ansible.builtin.file:
    src: "{{ role_path }}/files/catpacks"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/catpacks"
    state: link
    force: true

- name: prismlauncher | Clone theme
  ansible.builtin.git:
    repo: "{{ theme.repo }}"
    dest: "{{ role_path }}/files/theme"
    version: main
    force: true

- name: prismlauncher | Symlink theme
  ansible.builtin.file:
    src: "{{ role_path }}/files/theme"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/themes/{{ theme.name }}"
    state: link
    force: true

- name: prismlauncher | Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/prismlauncher.cfg"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/PrismLauncher/prismlauncher.cfg"
    state: link
    force: true
