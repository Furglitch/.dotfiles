---
- name: packwiz | get latest workflow run
  ansible.builtin.uri:
    url: "https://api.github.com/repos/packwiz/packwiz/actions/workflows/go.yml/runs?status=success&per_page=1"
    method: GET
    return_content: yes
    headers:
      Accept: "application/vnd.github.v3+json"
  register: workflow_runs
  become: false

- name: packwiz | get latest run artifacts
  ansible.builtin.uri:
    url: "{{ workflow_runs.json.workflow_runs[0].artifacts_url }}"
    method: GET
    return_content: yes
    headers:
      Accept: "application/vnd.github.v3+json"
  register: artifacts_list
  become: false
  when: workflow_runs.json.workflow_runs | length > 0

- name: packwiz | find Linux artifact
  ansible.builtin.set_fact:
    linux_artifact: "{{ artifacts_list.json.artifacts | selectattr('name', 'match', '.*Linux.*') | first }}"
  when: artifacts_list.json.artifacts | length > 0

- name: packwiz | ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: packwiz | get artifact download URL
  ansible.builtin.uri:
    url: "{{ linux_artifact.archive_download_url }}"
    method: GET
    follow_redirects: none
    headers:
      Accept: "application/vnd.github.v3+json"
      Authorization: "Bearer {{ github_token }}"
    status_code: 302
  register: artifact_redirect
  when: linux_artifact is defined
  become: false
  no_log: true

- name: packwiz | download from Azure storage
  ansible.builtin.get_url:
    url: "{{ artifact_redirect.location }}"
    dest: "/tmp/packwiz-linux.zip"
  when: linux_artifact is defined
  become: false

- name: packwiz | extract artifact to .local/bin
  ansible.builtin.unarchive:
    src: "/tmp/packwiz-linux.zip"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/"
    remote_src: yes
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: packwiz | set executable permissions
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/packwiz"
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: packwiz | cleanup temp file
  ansible.builtin.file:
    path: "/tmp/packwiz-linux.zip"
    state: absent
