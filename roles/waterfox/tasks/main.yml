---
- name: waterfox | ensure waterfox installed
  kewlfft.aur.aur:
    name: waterfox-bin
    state: present
    use: paru
    extra_args: --mflags --skipinteg
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: waterfox | create profile directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.waterfox/123a1234.furglitch"
    state: directory
    mode: '0755'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: waterfox | install ff-ultima theme
  ansible.builtin.include_tasks: ff-ultima.yml