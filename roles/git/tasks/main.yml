---
- name: git | ensure git installed
  kewlfft.aur.aur:
    name: git
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: git | ensure github-cli installed
  kewlfft.aur.aur:
    name: github-cli
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: git | configure user name
  community.general.git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: git | configure user email
  community.general.git_config:
    name: user.email
    value: "{{ git_user_email }}"
    scope: global
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'