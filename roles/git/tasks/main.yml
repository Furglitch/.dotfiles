---
- name: git | Install git
  kewlfft.aur.aur:
    name: git
    state: present
    use: paru

- name: git | Install github-cli
  kewlfft.aur.aur:
    name: github-cli
    state: present
    use: paru

- name: git | Configure git username
  community.general.git_config:
    name: user.name
    value: "{{ git.user }}"
    scope: global

- name: git | Configure git email
  community.general.git_config:
    name: user.email
    value: "{{ git.mail }}"
    scope: global

- name: git | Configure default branch
  community.general.git_config:
    name: init.defaultBranch
    value: main
    scope: global

- name: git | Configure rebase pulls
  community.general.git_config:
    name: pull.rebase
    value: true
    scope: global
