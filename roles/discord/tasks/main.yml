---
- name: discord | ensure discord installed
  kewlfft.aur.aur:
    name: discord
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ignore_errors: true

- name: discord | ensure betterdiscordctl installed
  kewlfft.aur.aur:
    name: betterdiscordctl
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ignore_errors: true

- name: discord | ensure .config/BetterDiscord directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts["user_dir"] }}/.config/BetterDiscord'
    state: directory
    mode: '0755'
    owner: '{{ target_user }}'
    group: '{{ target_user }}'

- name: discord | ensure .config/BetterDiscord subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/BetterDiscord/{{ item.path | dirname }}"
    state: directory
    mode: '0755'
  with_filetree: betterdiscord/config
  when: item.state == 'file'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: discord | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/BetterDiscord/{{ item.path }}"
    state: link
    force: true
  with_filetree: betterdiscord/config
  when: item.state == 'file'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: discord | symlink bin files
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/bin/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item.path }}"
    state: link
    force: true
  with_filetree: betterdiscord/bin
  when: item.state == 'file'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'