---
- name: discord | install Discord
  kewlfft.aur.aur:
    name: discord
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: discord | install betterdiscordctl
  kewlfft.aur.aur:
    name: betterdiscordctl
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: discord | symlink betterdiscordctl-upgrade script
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/bin/betterdiscord-upgrade"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/betterdiscord-upgrade"
    state: link
    mode: "0755"

- name: discord | apply BetterDiscord config
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/BetterDiscord"
    state: link
