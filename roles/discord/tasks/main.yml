---
- name: discord | ensure discord is installed
  kewlfft.aur.aur:
    name: discord
    state: present
    use: paru

- name: discord | ensure betterdiscordctl is installed
  kewlfft.aur.aur:
    name: betterdiscordctl
    state: present
    use: paru

- name: discord | bin betterdiscordctl-upgrade script
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/bin/betterdiscord-upgrade"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/betterdiscord-upgrade"
    state: link
    mode: "0755"

- name: discord | apply betterdiscord config
  ansible.builtin.file:
    src: "{{ role_path }}/files/betterdiscord/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/BetterDiscord"
    state: link
