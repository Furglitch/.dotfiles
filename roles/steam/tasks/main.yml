---
- name: steam | ensure steam installed
  kewlfft.aur.aur:
    name: steam
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: "-H"
  ignore_errors: true

- name: steam | ensure steam-rom-manager installed
  kewlfft.aur.aur:
    name: steam-rom-manager-bin
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"
  ignore_errors: true

- name: steam | install millennium
  kewlfft.aur.aur:
    name: millennium
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: "-H"
  ignore_errors: true

- name: steam | launch steam to initialize addons
  shell: steam &
  become: true
  become_user: "{{ target_user }}"
  environment:
    DISPLAY: "{{ ansible_env.DISPLAY | default(':0') }}"
  changed_when: false

- name: steam | wait for steam process to start
  shell: |
    timeout=30
    elapsed=0
    while [ $elapsed -lt $timeout ]; do
      if pgrep -u "{{ target_user }}" steam >/dev/null 2>&1; then
        exit 0
      fi
      sleep 1
      elapsed=$((elapsed + 1))
    done
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: steam | wait for steam to fully initialize
  pause:
    seconds: 10

- name: steam | kill steam
  command: killall steam
  changed_when: false
  ignore_errors: true

- name: steam | cleanup launch log
  ansible.builtin.file:
    path: /tmp/steam_launch.log
    state: absent

- name: steam | configure millennium
  ansible.builtin.include_tasks: millenium.yml
  ignore_errors: true
