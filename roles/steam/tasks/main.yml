---
- name: steam | install Steam packages
  kewlfft.aur.aur:
    name:
      - steam
      - proton-ge-custom-bin
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: steam | install Millennium
  ansible.builtin.shell:
    cmd: 'curl -fsSL "https://steambrew.app/install.sh" | bash'
