---
- name: pacman | enable the multilib section
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^#\\[multilib\\]"
    line: "[multilib]"
    state: present
    backup: yes

- name: pacman | enable the multilib include directive
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^#?Include = /etc/pacman.d/mirrorlist"
    line: "Include = /etc/pacman.d/mirrorlist"
    insertafter: "^\\[multilib\\]"
    state: present

- name: pacman | enable Color
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^#Color"
    line: "Color"
    insertafter: "^\\[options\\]"
    state: present

- name: pacman | enable ILoveCandy
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^#ILoveCandy"
    line: "ILoveCandy"
    insertafter: "^\\[options\\]"
    state: present

- name: pacman | add target user to wheel group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: wheel
    append: yes

- name: pacman | allow wheel users to run sudo without a password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/10-wheel-nopasswd
    line: "%wheel ALL=(ALL) NOPASSWD: ALL"
    create: yes
    mode: "0440"
    owner: root
    group: root
    validate: "visudo -cf %s"

- name: pacman | update the package cache
  ansible.builtin.pacman:
    update_cache: yes
