---
- name: qt-wayland | ensure qt5-wayland installed
  kewlfft.aur.aur:
    name: qt5-wayland
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'
- name: qt-wayland | ensure qt6-wayland installed
  kewlfft.aur.aur:
    name: qt6-wayland
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'