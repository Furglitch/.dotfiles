---
- name: xdg-utils | ensure xdg-utils installed
  kewlfft.aur.aur:
    name: xdg-utils
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: xdg-utils | ensure xdg-desktop-portal-hyprland installed
  kewlfft.aur.aur:
    name: xdg-desktop-portal-hyprland
    state: present
    use: paru
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"

- name: xdg-utils | ensure .config/xdg-desktop-portal exists
  ansible.builtin.file:

- name: xdg-utils | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/xdg/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/{{ item.path }}"
    state: link
    force: true
  with_filetree: xdg/config
  when: item.state == "file"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"