; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = 2022-01_Toonzie_Monitor.png
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "2022-01_Toonzie_Monitor.mp4"
use-background-color = false
background-color = "#1e1e2e"
blur = 32
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "center-left"
align = "center"
format = "hh:mm"
font-family = "Ubuntu Nerd Font"
font-size = 120
font-weight = 900
color = "#b4befe"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Ubuntu Nerd Font"
font-size = 25
font-weight = 600
color = "#b4befe"
margin-top = -15

[LockScreen.Message]
display = false
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "Ubuntu Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#cdd6f4"
paint-icon = true
spacing = 0

[LoginScreen]
background = "2022-01_Toonzie_Monitor.mp4"
use-background-color = false
background-color = "#1e1e2e"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "left"
margin = 50

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 30
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 3
active-border-color = "#b4befe"
inactive-border-color = "#b4befe"

[LoginScreen.LoginArea.Username]
font-family = "Ubuntu Nerd Font"
font-size = 16
font-weight = 700
color = "#b4befe"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "Ubuntu Nerd Font"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#b4befe"
background-color = "#1e1e2e"
background-opacity = 0.0
border-size = 2
border-color = "#b4befe"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#b4befe"
background-opacity = 0.0
active-background-color = "#b4befe"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#b4befe"
active-content-color = "#1e1e2e"
border-size = 2
border-color = "#b4befe"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = true
font-family = "Ubuntu Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Ubuntu Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#cdd6f4"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Ubuntu Nerd Font"
font-size = 11
font-weight = 400
normal-color = "#cdd6f4"
warning-color = "#cdd6f4"
error-color = "#cdd6f4"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 100
size = 30
border-radius = 5
spacing = 10
font-family = "Ubuntu Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#1e1e2e"
background-opacity = 1.0
active-option-background-color = "#b4befe"
active-option-background-opacity = 1.0
content-color = "#b4befe"
active-content-color = "#1e1e2e"
font-family = "Ubuntu Nerd Font"
border-size = 2
border-color = "#b4befe"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 4
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 100
popup-width = 200
background-color = "#b4befe"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#b4befe"
active-content-color = "#1e1e2e"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-left"
index = 3
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#b4befe"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#b4befe"
active-content-color = "#1e1e2e"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-left"
index = 2
background-color = "#b4befe"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#b4befe"
active-content-color = "#1e1e2e"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-left"
index = 1
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#b4befe"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#b4befe"
active-content-color = "#1e1e2e"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#1e1e2e"
background-opacity = 1.0
key-content-color = "#b4befe"
key-color = "#1e1e2e"
key-opacity = 1.0
key-active-background-color = "#1e1e2e"
key-active-opacity = 0.0
selection-background-color = "#313244"
selection-content-color = "#b4befe"
primary-color = "#cba6f7"
border-size = 2
border-color = "#b4befe"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Ubuntu Nerd Font"
font-size = 11
content-color = "#b4befe"
background-color = "#1e1e2e"
background-opacity = 1.0
border-radius = 5
disable-user = false
disable-login-button = false