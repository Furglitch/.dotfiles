---
- name: sddm | install SDDM packages
  kewlfft.aur.aur:
    name:
      - sddm
      - sddm-kcm
      - qt5-declarative
      - plasma-meta
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: sddm | copy theme directory
  ansible.builtin.copy:
    src: "{{ role_path }}/files/theme/"
    dest: "{{ theme.path }}"
    mode: preserve
    owner: root
    group: root

- name: sddm | ensure SDDM config directory exists
  ansible.builtin.file:
    path: "/etc/sddm.conf.d"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: sddm | ensure SDDM uses the silent SDDM theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/10-theme.conf
    mode: '0644'
    owner: root
    group: root
    content: |
      [Theme]
      Current={{ theme.name }}

- name: sddm | set the default system target to graphical
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

- name: sddm | ensure the SDDM service is enabled
  ansible.builtin.systemd_service:
    name: sddm.service
    enabled: true

- name: sddm | copy the custom background image
  ansible.builtin.copy:
    src: "{{ role_path }}/files/custom/background.png"
    dest: "/usr/share/sddm/themes/{{ theme.name }}/background.png"
    mode: preserve
    owner: root
    group: root

- name: sddm | insert the custom background into theme.conf
  ansible.builtin.lineinfile:
    path: "/usr/share/sddm/themes/{{ theme.name }}/theme.conf"
    regexp: '^(Background=).*'
    line: 'Background=background.png'
