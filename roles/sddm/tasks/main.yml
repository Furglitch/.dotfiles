---
- name: sddm | ensure packages are installed
  kewlfft.aur.aur:
    name:
      - sddm
      - sddm-kcm
      - qt5-declarative
    state: present
    use: paru

- name: sddm | copy theme directory
  ansible.builtin.copy:
    src: "{{ role_path }}/files/theme/"
    dest: "{{ theme.path }}"
    mode: preserve
    owner: root
    group: root

- name: sddm | ensure sddm uses silent sddm theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/10-theme.conf
    mode: '0644'
    owner: root
    group: root
    content: |
      [Theme]
      Current={{ theme.name }}

- name: sddm | set system default target to graphical
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

- name: sddm | ensure sddm service is enabled
  ansible.builtin.systemd_service:
    name: sddm.service
    enabled: true

- name: sddm | Insert custom background image
  ansible.builtin.copy:
    src: "{{ role_path }}/files/custom/background.png"
    dest: "/usr/share/sddm/themes/{{ theme.name }}/background.png"
    mode: preserve
    owner: root
    group: root

- name: sddm | Insert custom background into theme.conf
  ansible.builtin.lineinfile:
    path: "/usr/share/sddm/themes/{{ theme.name }}/theme.conf"
    regexp: '^(Background=).*'
    line: 'Background=background.png'
