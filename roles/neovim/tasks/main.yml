---
- name: neovim | Install neovim
  kewlfft.aur.aur:
    name: neovim
    state: present
    use: paru

- name: neovim | Clone config starter
  ansible.builtin.git:
    repo: "{{ config.repo }}"
    dest: "{{ role_path }}/files/config"
    version: "main"

- name: neovim | Remove included .git folder
  ansible.builtin.file:
    path: "{{ role_path }}/files/config/.git"
    state: absent

- name: neovim | Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    state: link
    force: true
