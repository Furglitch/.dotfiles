---
- name: neovim | install Neovim
  kewlfft.aur.aur:
    name: neovim
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: neovim | check config starter directory
  ansible.builtin.stat:
    path: "{{ role_path }}/files/config"
  register: neovim_config_repo

- name: neovim | clone the config starter
  ansible.builtin.git:
    repo: "{{ config.repo }}"
    dest: "{{ role_path }}/files/config"
    version: "main"
  when: not neovim_config_repo.stat.exists

- name: neovim | remove the included .git folder
  ansible.builtin.file:
    path: "{{ role_path }}/files/config/.git"
    state: absent

- name: neovim | ensure config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: "0755"

- name: neovim | symlink the config
  ansible.builtin.file:
    src: "{{ role_path }}/files/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    state: link
    force: true
