---
- name: zsh | ensure starship directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/starship"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: zsh | symlink starship config
  ansible.builtin.file:
    src: "{{ role_path }}/files/starship/starship.toml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship/starship.toml"
    state: link
    force: true