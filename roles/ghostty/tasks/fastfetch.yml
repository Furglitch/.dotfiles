---
- name: fastfetch | ensure .config/fastfetch directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/fastfetch"
    state: directory
    mode: "0755"

- name: fastfetch | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/fastfetch/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/fastfetch/{{ item.path }}"
    state: link
    force: true
  with_filetree: fastfetch/config
  when: item.state == "file"
