---
- name: ghostty | ensure ghostty installed
  kewlfft.aur.aur:
    name: ghostty
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'
- name: ghostty | uninstall kitty
  kewlfft.aur.aur:
    name: kitty
    state: absent
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'