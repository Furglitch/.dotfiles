---
- name: ghostty | ensure COPR repos are enabled
  community.general.copr:
    host: copr.fedorainfracloud.org
    name: "{{ item }}"
    state: enabled
  loop: "{{ ghostty_copr_repos }}"

- name: ghostty | ensure packages are installed
  ansible.builtin.dnf:
    name: "{{ ghostty_packages }}"
    state: present

- name: ghostty | ensure the .config/ghostty directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
    state: directory
    mode: "0755"

- name: ghostty | ensure config subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ghostty/{{ item.path }}"
    state: directory
    mode: "0755"
  with_filetree: ghostty/config
  when: item.state == "directory"

- name: ghostty | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/ghostty/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/{{ item.path }}"
    state: link
    force: true
  with_filetree: ghostty/config
  when: item.state == "file"

- name: ghostty | run command-based installers
  ansible.builtin.shell:
    cmd: "{{ item }}"
  loop: "{{ ghostty_commands }}"

- name: ghostty | include fastfetch tasks
  ansible.builtin.include_tasks: fastfetch.yml

- name: ghostty | include zsh tasks
  ansible.builtin.include_tasks: zsh.yml
