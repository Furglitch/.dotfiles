---
- name: ghostty | ensure ghostty installed
  kewlfft.aur.aur:
    name: ghostty
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: ghostty | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/ghostty/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/{{ item.path }}"
    state: link
    force: true
  with_filetree: ghostty/config
  when: item.state == 'file'
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: ghostty | uninstall kitty
  kewlfft.aur.aur:
    name: kitty
    state: absent
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'