---
- name: grub | ensure grub installed
  kewlfft.aur.aur:
    name: grub
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'
- name: grub | ensure os-prober installed
  kewlfft.aur.aur:
    name: os-prober
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'