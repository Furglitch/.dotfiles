---
- name: docker | install Docker
  kewlfft.aur.aur:
    name: docker
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: docker | install Docker Compose
  kewlfft.aur.aur:
    name: docker-compose
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: docker | add user to the docker group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: yes
  become: true
