---
- name: gimp | install GIMP
  kewlfft.aur.aur:
    name: gimp
    state: present
    use: paru

- name: gimp | install ImageMagick
  kewlfft.aur.aur:
    name: imagemagick-full
    state: present
    use: paru

- name: gimp | install Upscayl
  kewlfft.aur.aur:
    name: upscayl-bin
    state: present
    use: paru
