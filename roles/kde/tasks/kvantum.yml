---
- name: kvantum | install Kvantum
  kewlfft.aur.aur:
    name:
      - kinfocenter
      - kdeclarative
      - qt6ct-kde
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: kvantum | create the Kvantum config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/Kvantum"
    state: directory
    mode: "0755"

- name: kvantum | create the Qt6ct config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/qt6ct"
    state: directory
    mode: "0755"

- name: kvantum | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/kvantum/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/Kvantum/{{ item.path }}"
    state: link
    force: true
  with_filetree: kvantum/config
  when: item.state == "file"

- name: kvantum | symlink the Qt6ct config
  ansible.builtin.file:
    src: "{{ role_path }}/files/qt6ct.conf"
    dest: "{{ ansible_facts['user_dir'] }}/.config/qt6ct/qt6ct.conf"
    state: link
    force: true
  with_filetree: qt6ct/config
  when: item.state == "file"

- name: kvantum | clone the theme
  ansible.builtin.git:
    repo: "{{ kvantum.theme.repo }}"
    dest: "{{ role_path }}/files/kvantum/theme/{{ kvantum.theme.path }}"
    version: "main"
    force: true

- name: kvantum | symlink the theme
  ansible.builtin.file:
    src: "{{ role_path }}/files/kvantum/theme/{{ kvantum.theme.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/Kvantum/custom-theme"
    state: link
    force: true
  tags:
