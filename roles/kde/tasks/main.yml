---
- name: kde | run ark tasks
  ansible.builtin.include_tasks: ark.yml

- name: kde | run dolphin tasks
  ansible.builtin.include_tasks: dolphin.yml

- name: kde | run kinfocenter tasks
  ansible.builtin.include_tasks: kinfocenter.yml

- name: kde | run partitionmanager tasks
  ansible.builtin.include_tasks: partitionmanager.yml

- name: kde | Install additional packages
  kewlfft.aur.aur:
    name:
      - iwd
      - plasma-nm
      - plasma-pa
      - plasma-systemmonitor
      - systemsettings
      - bluedevil
      - colord-kde-git
      - kde-gtk-config
      - pinentry-hypr
    state: present
    use: paru

- name: kde | Symlink kdeglobals
  ansible.builtin.file:
    src: "{{ role_path }}/files/kdeglobals"
    dest: "{{ ansible_facts['user_dir'] }}/.config/kdeglobals"
    state: link
    force: true

- name: kde | Symlink mimeapps.list
  ansible.builtin.file:
    src: "{{ role_path }}/files/mimeapps.list"
    dest: "{{ ansible_facts['user_dir'] }}/.config/mimeapps.list"
    state: link
    force: true
