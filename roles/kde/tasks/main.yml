---
- name: kde | install plasma-systemsettings stack
  ansible.builtin.import_tasks: plasma-systemsettings.yml
  tags:
    - kde

- name: kde | install kwalletmanager5 stack
  ansible.builtin.import_tasks: kwalletmanager5.yml
  tags:
    - kde

- name: kde | install dolphin stack
  ansible.builtin.import_tasks: dolphin.yml
  tags:
    - kde

- name: kde | install kvantum stack
  ansible.builtin.import_tasks: kvantum.yml
  tags:
    - kde

- name: kde | install kinfocenter
  ansible.builtin.import_tasks: kinfocenter.yml
  tags:
    - kde

- name: kde | install plasma-pa
  ansible.builtin.import_tasks: plasma-pa.yml
  tags:
    - kde

- name: kde | install kde-partitionmanager stack
  ansible.builtin.import_tasks: kde-partitionmanager.yml
  tags:
    - kde

- name: kde | install ark stack
  ansible.builtin.import_tasks: ark.yml
  tags:
    - kde

- name: kde | install plasma-nm stack
  ansible.builtin.import_tasks: plasma-nm.yml
  tags:
    - kde

- name: kde | install plasma-systemmonitor
  ansible.builtin.import_tasks: plasma-systemmonitor.yml
  tags:
    - kde

- name: kde | symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/kde/config/{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.path }}"
    state: link
    force: true
  with_filetree: kde/config
  when: item.state == "file"
  become: true
  become_user: "{{ target_user }}"
  become_flags: "-H"