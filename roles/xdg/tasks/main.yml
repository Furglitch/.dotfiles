---
- name: xdg | Install packages
  kewlfft.aur.aur:
    name:
      - xdg-utils
      - xdg-desktop-portal
      - xdg-desktop-portal-hyprland
    state: present
    use: paru

- name: xdg | symlink xdg config directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/xdg/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal"
    state: link
