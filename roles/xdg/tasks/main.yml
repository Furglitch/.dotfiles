---
- name: xdg | install XDG packages
  kewlfft.aur.aur:
    name:
      - xdg-utils
      - xdg-desktop-portal
      - xdg-desktop-portal-hyprland
    state: present
    use: paru
  become_user: "{{ target_user }}"

- name: xdg | ensure config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal"
    state: directory
    mode: "0755"

- name: xdg | symlink portals config
  ansible.builtin.file:
    src: "{{ role_path }}/files/portals.conf"
    dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/portals.conf"
    state: link
