---
- name: paru | check for updates
  ansible.builtin.include_tasks: update.yml

- name: paru | clear the lingering build directory
  ansible.builtin.file:
    path: /tmp/paru
    state: absent
  when: paru_needs_build | default(true) | bool

- name: paru | clone Paru from the AUR
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru-bin.git
    dest: /tmp/paru
  become_user: "{{ target_user }}"
  when: paru_needs_build | default(true) | bool

- name: paru | ensure Paru dependencies are installed
  ansible.builtin.pacman:
    name:
      - base-devel
      - git
    state: present
  when: paru_needs_build | default(true) | bool

- name: paru | install Paru
  ansible.builtin.shell: makepkg -si --noconfirm
  args:
    chdir: /tmp/paru
  become_user: "{{ target_user }}"
  when: paru_needs_build | default(true) | bool

- name: paru | configure the Chaotic AUR repo
  ansible.builtin.include_tasks: chaotic-aur.yml

- name: paru | clear the build directory
  ansible.builtin.file:
    path: /tmp/paru
    state: absent
  when: paru_needs_build | default(true) | bool
