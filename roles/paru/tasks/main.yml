---
- name: paru | Check if paru is installed
  ansible.builtin.stat:
    path: /usr/bin/paru
  register: paru_installed

- name: paru | Check for updates
  when: paru_installed.stat.exists
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ansible.builtin.command: paru -Qu paru
  register: paru_update_check
  changed_when: false
  failed_when: false

- name: paru | Report up to date
  when: paru_installed.stat.exists and paru_update_check.rc != 0
  ansible.builtin.debug:
    msg: "paru is already up to date"

- name: paru | Try self-update
  when: paru_installed.stat.exists and paru_update_check.rc == 0
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ansible.builtin.command: paru -S paru --noconfirm
  register: paru_self_update
  changed_when: paru_self_update.rc == 0
  failed_when: false

- name: paru | Set build flag
  ansible.builtin.set_fact:
    paru_needs_build: "{{ not paru_installed.stat.exists or (paru_update_check.rc == 0 and paru_self_update.rc != 0) }}"

- name: paru | Clean build directory
  when: paru_needs_build
  ansible.builtin.file:
    path: /tmp/paru
    state: absent

- name: paru | Clone repository
  when: paru_needs_build
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ansible.builtin.git:
    repo: 'https://aur.archlinux.org/paru.git'
    dest: '/tmp/paru'
    clone: true
    depth: 1
    version: master

- name: paru | Update system before installing dependencies
  when: paru_needs_build
  become: true
  ansible.builtin.pacman:
    update_cache: yes
    upgrade: yes

- name: paru | Install build dependencies
  when: paru_needs_build
  become: true
  ansible.builtin.pacman:
    name:
      - base-devel
      - git
      - rust
      - cargo
      - llvm
      - clang
    state: present

- name: paru | Build and install package
  when: paru_needs_build
  become: true
  become_user: "{{ target_user }}"
  become_flags: '-H'
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm --needed
    chdir: /tmp/paru
  changed_when: true

- name: paru | Clean up build directory
  when: paru_needs_build
  ansible.builtin.file:
    path: /tmp/paru
    state: absent
