---
- name: btop | uninstall htop
  kewlfft.aur.aur:
    name: htop
    state: absent
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'

- name: btop | ensure btop installed
  kewlfft.aur.aur:
    name: btop
    state: present
    use: paru
  become_user: "{{ target_user }}"
  become_flags: '-H'