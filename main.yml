---
- name: dotfiles
  hosts: localhost
  connection: local
  become: yes

  pre_tasks:
    - name: pre_tasks | detect invoking user
      ansible.builtin.import_tasks: pre_tasks/user.get.yml

    - name: pre_tasks | set ~/.local/bin in PATH
      ansible.builtin.import_tasks: pre_tasks/path.local_bin.yml

    - name: pre_tasks | ensure base user directories are owned by target user
      ansible.builtin.import_tasks: pre_tasks/user.own_dir.yml

  tasks:
    - name: ansible | run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ default_roles | reject('in', exclude_roles | default([])) | list }}"
