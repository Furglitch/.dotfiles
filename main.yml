---
- name: archdot
  hosts: localhost
  connection: local
  become: yes

  pre_tasks:
    - name: Detect invoking user
      ansible.builtin.set_fact:
        target_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
      tags:
        - always

    - name: Resolve invoking user's home directory
      ansible.builtin.shell: "getent passwd {{ target_user }} | cut -d: -f6"
      register: target_home_cmd
      changed_when: false
      tags:
        - always

    - name: Override ansible_facts.user_dir to invoking user's home
      ansible.builtin.set_fact:
        ansible_facts:
          user_dir: "{{ target_home_cmd.stdout | default(ansible_facts['user_dir']) }}"
      tags:
        - always

    - name: Configure passwordless sudo for AUR operations
      ansible.builtin.copy:
        content: "{{ target_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/archdot-aur
        mode: '0440'
        validate: 'visudo -cf %s'
      tags:
        - always

    - name: Add ~/.local/bin to PATH
      ansible.builtin.import_tasks: pre_tasks/path.local_bin.yml
      tags:
        - always

  tasks:
    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: "{% if ansible_run_tags | list == ['all'] %}{{ default_roles | reject('in', exclude_roles | default([])) | list }}{% else %}{{ (default_roles | select('in', ansible_run_tags) | list) + (ansible_run_tags | reject('in', default_roles) | reject('equalto', 'all') | list) }}{% endif %}"
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always