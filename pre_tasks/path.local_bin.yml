---
- name: path.local_bin | ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts["user_dir"] }}/.local/bin'
    state: directory
    mode: '0755'
    owner: '{{ target_user }}'
    group: '{{ target_user }}'

- name: path.local_bin | ensure PATH includes ~/.local/bin
  ansible.builtin.lineinfile:
    path: '{{ ansible_env.SHELL | regex_search("zsh") | ternary(ansible_facts["user_dir"] + "/.zshrc", ansible_facts["user_dir"] + "/.bashrc") }}'
    regexp: '^(export\s+PATH=.+)?\$HOME/.local/bin:\$PATH'
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present
    create: yes
    owner: '{{ target_user }}'
    group: '{{ target_user }}'
